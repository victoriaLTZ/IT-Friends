<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>Mon équipe — Big Game</title>
<style>
  * { box-sizing: border-box; }
  .card {
    background: var(--card-bg); border-radius: 24px; padding: 24px 20px;
    max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(233,30,140,0.15);
    margin: 20px auto;
  }
  h2 { color: var(--primary-dark); margin-top: 0; }
  h3 { color: var(--purple); font-size: 16px; margin-bottom: 8px; }
  input[type=text] {
    width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--secondary);
    font-size: 16px; margin-bottom: 14px; background: white;
  }
  button {
    background: linear-gradient(90deg, var(--primary), var(--purple));
    color: white; border: none; border-radius: 999px;
    padding: 13px 20px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status-msg { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 10px; }
  .riddle-box {
    background: linear-gradient(135deg, #FFF0F8, #E0F7FA);
    border-radius: 16px; padding: 18px; margin-bottom: 16px; text-align: center;
  }
  .riddle-box p { font-style: italic; font-size: 16px; color: var(--text-dark); margin: 0; }
  .clue-item { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
  .clue-item.charge { background: #FDEAEA; border-left: 4px solid #D94A4A; }
  .clue-item.decharge { background: #E8F5EA; border-left: 4px solid #4A9D5C; }
  .clue-item.neutre { background: #F0F0F0; border-left: 4px solid #999; }
  .clue-item .target { font-weight: 700; color: var(--primary-dark); }
  .points-badge {
    display: inline-block; background: var(--accent); color: var(--text-dark);
    padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 12px;
  }
  .logout-link { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 16px; cursor: pointer; text-decoration: underline; }
  .bonus-banner { background: var(--primary); color: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: center; }
  .bonus-banner h3 { color: white; }

  .clue-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .clue-modal {
    position: relative; background: var(--card-bg); border-radius: 20px; padding: 24px 20px;
    max-width: 380px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .clue-modal h3 { color: var(--primary-dark); margin-top: 0; }
  .clue-modal-close {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface-2, #f0e6d2); border: none; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .clue-modal .target-name { font-weight: 700; color: var(--purple); margin-bottom: 4px; }
</style>

  
</style>
</head>
<body>
  <div style="text-align:center; margin-top:12px;">
    <a href="index.html" style="font-size:13px; color:var(--purple); text-decoration:underline;">← Voir le plateau</a>
  </div>
  
  <div class="card" id="card"></div>

<script>
const API_URL = window.location.origin + '/api';

let session = JSON.parse(localStorage.getItem('team_session') || 'null');
let bonusActive = null;

function renderLogin() {
  const card = document.getElementById('card');
  card.innerHTML = `
    <h2>🔐 Mon équipe</h2>
    <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">Entre ton code personnel reçu à la création de ton personnage</p>
    <input type="text" id="code-input" placeholder="Ton code (ex: F98069)">
    <button id="login-btn">Entrer</button>
    <p id="status-msg"></p>
  `;
  document.getElementById('login-btn').onclick = onLogin;
}

async function onLogin() {
  const code = document.getElementById('code-input').value.trim();
  const statusMsg = document.getElementById('status-msg');
  if (!code) return;

  statusMsg.textContent = 'Connexion...';
  const res = await fetch(`${API_URL}/players/by-code/${code}`);
  if (!res.ok) {
    statusMsg.textContent = 'Code invalide';
    return;
  }
  const data = await res.json();
  const player = data.player;

  if (!player.team_id) {
    statusMsg.textContent = "Tu n'as pas encore d'équipe assignée, reviens plus tard !";
    return;
  }

  session = { playerId: player.id, playerName: player.name, teamId: player.team_id };
  localStorage.setItem('team_session', JSON.stringify(session));
  renderDashboard();
}

function logout() {
  session = null;
  localStorage.removeItem('team_session');
  renderLogin();
}

async function renderDashboard() {
  const card = document.getElementById('card');
  card.innerHTML = `<h2>Chargement...</h2>`;

  const [stationRes, cluesRes, teamsRes, bonusRes] = await Promise.all([
    fetch(`${API_URL}/teams/${session.teamId}/current-station`),
    fetch(`${API_URL}/teams/${session.teamId}/clues`),
    fetch(`${API_URL}/teams`),
    fetch(`${API_URL}/bonus/active`),
  ]);

  const station = await stationRes.json();
  const clues = await cluesRes.json();
  const teams = await teamsRes.json();
  const myTeam = teams.find(t => t.id === session.teamId);

  const bonusStatus = await bonusRes.json();
  bonusActive = bonusStatus.active ? { active: true, bonus_id: bonusStatus.bonus_id, prompt: bonusStatus.prompt, image_url: bonusStatus.image_url } : null;

  let riddleHtml = '';
  if (station.finished) {
    riddleHtml = `<div class="riddle-box"><p>🏁 Vous avez terminé toutes les stations !</p></div>`;
  } else {
    riddleHtml = `
      <div class="riddle-box"><p>${station.riddle}</p></div>
      <input type="text" id="team-code-input" placeholder="Code trouvé sur place">
      <button id="submit-code-btn">Valider</button>
      <p id="code-feedback"></p>
    `;
  }

  const cluesHtml = clues.length === 0
    ? `<p style="font-size:13px; color:var(--text-muted);">Aucun indice récolté pour l'instant.</p>`
    : clues.map(c => `
        <div class="clue-item ${c.kind}">
            ${c.image_url ? `<img src="${c.image_url}" style="width:100%; border-radius:8px; margin-bottom:8px;">` : ''}
            <span class="target">${c.target_player}</span> — ${c.station}<br>
            ${c.text}
        </div>
        `).join('');

  card.innerHTML = `
    <h2>${myTeam ? myTeam.name : 'Ton équipe'}</h2>
    <p style="font-size:13px; color:var(--text-muted); margin-top:-10px;">Connecté(e) en tant que ${session.playerName}</p>
    <div class="points-badge">⭐ ${myTeam ? myTeam.team_points : 0} points</div>

    <div id="bonus-slot"></div>

    <h3>Énigme en cours</h3>
    ${riddleHtml}

    <h3 id="clues-toggle" style="cursor:pointer; user-select:none;">Indices récoltés (${clues.length}) <span id="clues-arrow">▸</span></h3>
    <div id="clues-list" style="display:none;">${cluesHtml}</div>

    <p class="logout-link" id="logout-link">Se déconnecter</p>
  `;

  if (!station.finished) {
    document.getElementById('submit-code-btn').onclick = onSubmitCode;
  }
  document.getElementById('logout-link').onclick = logout;

  document.getElementById('clues-toggle').onclick = () => {
    const list = document.getElementById('clues-list');
    const arrow = document.getElementById('clues-arrow');
    const isHidden = list.style.display === 'none';
    list.style.display = isHidden ? 'block' : 'none';
    arrow.textContent = isHidden ? '▾' : '▸';
  };

  renderBonusSlot();
}

function renderBonusSlot() {
  const slot = document.getElementById('bonus-slot');
  if (!slot) return;
  if (bonusActive && bonusActive.active) {
    const alreadySubmitted = bonusMySubmission && bonusMySubmission.bonus_id === bonusActive.bonus_id;
    slot.innerHTML = `
      <div class="bonus-banner">
        <h3>⚡ Question spéciale !</h3>
        ${bonusActive.image_url ? `<img src="${bonusActive.image_url}" style="width:100%; border-radius:10px; margin-bottom:10px;">` : ''}
        <p style="margin-bottom:12px;">${bonusActive.prompt}</p>
        ${alreadySubmitted ? `
          <p style="font-size:14px;">✅ Réponse envoyée : « ${bonusMySubmission.answer} »</p>
          <p style="font-size:12px; opacity:0.85;">En attente de la décision de l'organisateur...</p>
          <button id="edit-answer-btn" style="background:white; color:var(--primary); margin-top:8px;">Modifier ma réponse</button>
        ` : `
          <input type="text" id="bonus-answer-input" placeholder="Votre réponse" value="${bonusMySubmission?.answer || ''}" style="width:100%; padding:10px; border-radius:10px; border:none; margin-bottom:8px;">
          <button id="bonus-submit-btn" style="background:white; color:var(--primary);">Envoyer</button>
        `}
        <p id="buzz-feedback" style="font-size:13px; margin-top:8px;"></p>
      </div>
    `;
    if (alreadySubmitted) {
      document.getElementById('edit-answer-btn').onclick = () => {
        bonusMySubmission = null;
        renderBonusSlot();
      };
    } else {
      document.getElementById('bonus-submit-btn').onclick = onBonusAnswer;
    }
  } else {
    slot.innerHTML = '';
  }
}

function showClueModal(clue) {
  const overlay = document.createElement('div');
  overlay.className = 'clue-modal-overlay';
  overlay.innerHTML = `
    <div class="clue-modal">
      <button class="clue-modal-close" id="clue-modal-close">✕</button>
      <h3>🔍 Nouvel indice !</h3>
      ${clue.image_url ? `<img src="${clue.image_url}" style="width:100%; border-radius:10px; margin-bottom:10px;">` : ''}
      <p class="target-name">${clue.target_player}</p>
      <p style="font-size:14px;">${clue.text}</p>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('clue-modal-close').onclick = () => overlay.remove();
}

async function onSubmitCode() {
  const input = document.getElementById('team-code-input');
  const feedback = document.getElementById('code-feedback');
  const code = input.value.trim();
  if (!code) return;

  const res = await fetch(`${API_URL}/teams/${session.teamId}/submit-code`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code }),
  });
  const data = await res.json();

  if (data.correct) {
    feedback.innerHTML = `<span style="color:#2F6B3A;">✅ Bravo, vous avancez !</span>`;
    await renderDashboard();
    if (data.clue) {
      showClueModal(data.clue);
    }
  } else {
    feedback.innerHTML = `<span style="color:#9C2E2E;">❌ Code incorrect</span>`;
    input.value = '';
  }
}

async function onBonusAnswer() {
  const input = document.getElementById('bonus-answer-input');
  const feedback = document.getElementById('buzz-feedback');
  const answer = input.value.trim();
  if (!answer) return;

  const res = await fetch(`${API_URL}/bonus/${bonusActive.bonus_id}/submit-answer`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: session.teamId, answer }),
  });
  const data = await res.json();

  if (data.submitted) {
    bonusMySubmission = { bonus_id: bonusActive.bonus_id, answer };
    renderBonusSlot();
  } else {
    feedback.innerHTML = `La question vient d'être résolue.`;
  }
}

function connectWebSocket() {
  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.event === 'bonus_started') {
      bonusActive = { active: true, bonus_id: message.bonus_id, prompt: message.prompt, image_url: message.image_url };
      bonusMySubmission = null;
      renderBonusSlot();
    }
    if (message.event === 'bonus_won') {
      bonusActive = null;
      const card = document.getElementById('card');
      const winnerBanner = document.createElement('div');
      winnerBanner.className = 'bonus-banner';
      winnerBanner.innerHTML = `<h3>🏆 ${message.team_name} remporte la question !</h3><p>+10 points</p>`;
      card.prepend(winnerBanner);
      setTimeout(() => { renderDashboard(); }, 3000);
    }
    if (message.event === 'team_advanced' && session && message.team_id === session.teamId) {
      const badge = document.querySelector('.points-badge');
      if (badge) badge.textContent = `⭐ ${message.team_points} points`;
    }
  };
}

// ---------- Démarrage ----------
connectWebSocket();
if (session) {
  renderDashboard();
} else {
  renderLogin();
}
</script>
</body>
</html>
